<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="log-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- 背景サークル -->
  <circle cx="50" cy="50" r="46" fill="url(#log-grad)" stroke="#ffffff" stroke-width="3.5" filter="url(#glow)"/>
  
  <!-- 日誌／カレンダーノート -->
  <path d="M28 24 h44 a5 5 0 0 1 5 5 v42 a5 5 0 0 1 -5 5 h-44 a5 5 0 0 1 -5 -5 v-42 a5 5 0 0 1 5 -5 z" fill="#ffffff" filter="url(#glow)"/>
  <path d="M23 34 h54" stroke="#059669" stroke-width="4"/>
  <!-- バインダーリング -->
  <circle cx="35" cy="24" r="3" fill="#064e3b"/>
  <circle cx="50" cy="24" r="3" fill="#064e3b"/>
  <circle cx="65" cy="24" r="3" fill="#064e3b"/>
  
  <!-- チェックマーク＆ログ行 -->
  <path d="M34 46 l6 6 l14 -14" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M34 64 h32 M60 48 h10" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round"/>
</svg>
